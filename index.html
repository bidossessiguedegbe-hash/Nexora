<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA — One Platform. Total Control.</title>
<meta name="theme-color" content="#0B1F3A">
<meta name="description" content="NEXORA : logiciel de gestion et de comptabilité pour entreprises (prototype).">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXORA">
<style>
:root{
  --navy:#0B1F3A; --navy-2:#142C52; --navy-3:#1E3C6B;
  --ink:#16202D; --muted:#5F6B7B; --line:#DCE2EA; --bg:#F2F4F8; --surface:#FFFFFF;
  --accent:#1F5FBF; --accent-soft:#E7EFFC;
  --pos:#1E8A5A; --pos-soft:#E5F4EC; --neg:#C23B3B; --neg-soft:#FBE9E9; --warn:#9A6A00; --warn-soft:#FFF3D6;
  --radius:6px;
  --font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#app{display:flex;min-height:100vh}
/* Sidebar */
#side{width:248px;background:var(--navy);color:#C9D4E6;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 22px 18px;display:flex;align-items:center;gap:12px;color:#fff}
.brand svg{flex:none}
.brand b{font-size:19px;letter-spacing:.14em;font-weight:700}
.brand small{display:block;font-size:11px;letter-spacing:.02em;color:#8FA3C4;margin-top:1px}
#side nav{padding:6px 10px 20px;flex:1}
#side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:var(--radius);color:#C9D4E6;text-decoration:none;font-size:14.5px}
#side a:hover{background:var(--navy-2);color:#fff}
#side a.on{background:var(--navy-3);color:#fff;font-weight:600}
#side a .soon{font-size:11px;background:#223B66;color:#9FB2D3;padding:1px 7px;border-radius:20px}
#side .grp{font-size:12px;color:#7F93B6;padding:14px 12px 4px}
#side .foot{padding:14px 20px 18px;font-size:12px;color:#7F93B6;border-top:1px solid #1B3560}
/* Top bar */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;position:sticky;top:0;z-index:20}
#top select,#top input[type=date]{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-width:230px}
#top .sp{flex:1}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:7px 10px;cursor:pointer}
.eq{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.eq i{width:9px;height:9px;border-radius:50%;background:var(--pos);display:inline-block}
.eq.bad{border-color:var(--neg);background:var(--neg-soft)}
.eq.bad i{background:var(--neg)}
#view{padding:24px;max-width:1280px;width:100%;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px;max-width:78ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>*,.grid2b>*,.hero>*{min-width:0}
.banner{padding:10px 14px;border-radius:var(--radius);margin-bottom:16px;font-size:14px;border:1px solid}
.banner.demo{background:var(--warn-soft);border-color:#EBCB85;color:#6B4A00}
.banner.info{background:var(--accent-soft);border-color:#BCD1F4;color:#173E7B}
.banner.bad{background:var(--neg-soft);border-color:#EDB5B5;color:#8E2323}
.banner.ok{background:var(--pos-soft);border-color:#B3DEC6;color:#155E3D}
/* Hero result */
.hero{display:grid;grid-template-columns:minmax(260px,1.2fr) 2fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.hero .res{padding:22px;background:var(--navy);color:#fff}
.hero .res .lb{font-size:13px;color:#A9BADA}
.hero .res .big{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hero .res .tag{display:inline-block;font-size:12px;background:#223B66;color:#BFD0EE;padding:2px 9px;border-radius:20px}
.hero .res .pos{color:#7FE0B0}.hero .res .neg{color:#FFA3A3}
.kp{display:grid;grid-template-columns:repeat(3,1fr)}
.kp>div{padding:16px 18px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.kp>div:nth-child(3n+1){border-left:0}
.kp>div:nth-last-child(-n+3){border-bottom:0}
.kp .lb{font-size:13px;color:var(--muted)}
.kp .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.kp .h{font-size:12px;color:var(--muted)}
.d-up{color:var(--pos)}.d-down{color:var(--neg)}
/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#F7F9FC;text-align:left;font-weight:600;color:#3C4859;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid #EDF0F5;vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F5F8FD}
tr.tot td{font-weight:600;background:#F7F9FC;border-top:1px solid var(--line)}
tr.grp td{background:#F2F5FA;font-weight:600}
tr.sub td{color:var(--muted)}
td.ind{padding-left:30px}
.neg{color:var(--neg)}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.chip.v{background:var(--pos-soft);border-color:#B3DEC6;color:#155E3D}
.chip.d{background:var(--warn-soft);border-color:#EBCB85;color:#6B4A00}
.chip.r{background:var(--neg-soft);border-color:#EDB5B5;color:#8E2323}
.chip.demo{background:var(--warn-soft);border-color:#EBCB85;color:#6B4A00}
/* Forms */
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid #C6CFDB;border-radius:var(--radius);background:#fff}
textarea{min-height:70px;resize:vertical}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid #C6CFDB;background:#fff;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{background:#F4F7FB}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{background:#184FA0}
.btn.dng{color:var(--neg);border-color:#E3B1B1}.btn.dng:hover{background:var(--neg-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.errs{background:var(--neg-soft);border:1px solid #EDB5B5;color:#8E2323;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.errs ul{margin:4px 0 0 18px;padding:0}
.lines input{padding:6px 8px;min-width:90px}
.lines td{padding:5px 6px}
.lines .acc{min-width:150px}.lines .lab{min-width:180px}.lines .amt{text-align:right;min-width:110px}
.hint{font-size:12px;color:var(--muted);min-height:16px;margin-top:2px}
.tots{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin:14px 0;font-variant-numeric:tabular-nums}
.tots b{font-size:17px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--navy);border-color:var(--accent)}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty h2{color:var(--ink)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid #EDF0F5;display:flex;gap:10px;align-items:flex-start}
.list li:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.dot.w{background:#D69A00}.dot.b{background:var(--neg)}.dot.i{background:var(--accent)}.dot.g{background:var(--pos)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg text{font-family:var(--font);fill:#5F6B7B;font-size:11px}
/* Modal / toast */
#modal{position:fixed;inset:0;background:rgba(11,31,58,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;z-index:50}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:8px;max-width:860px;width:100%;padding:22px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:14px;max-width:90vw}
#toast div.bad{background:var(--neg)}
.small{font-size:13px;color:var(--muted)}
.right{text-align:right}
.mt{margin-top:14px}
@media (max-width:1000px){
  .grid2,.grid2b,.hero{grid-template-columns:minmax(0,1fr)}
  .kp{grid-template-columns:repeat(2,1fr)}
  .kp>div{border-left:0!important;border-bottom:1px solid var(--line)!important}
  .kp>div:nth-child(even){border-left:1px solid var(--line)!important}
}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .18s}
  #side.open{transform:none}
  #menuBtn{display:inline-block}
  #top{padding:10px 14px}
  #view{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  #side,#top,.noprint,#toast{display:none!important}
  body,#view{background:#fff;padding:0}
  .panel{border:0;padding:0}
}
@media print{body.pm #app{display:none!important}body.pm #modal{position:static;background:#fff;padding:0;display:block}body.pm #modal .box{max-width:none;padding:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Navigation principale"></aside>
  <div id="main">
    <header id="top"></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" aria-live="polite"></div>

<script>
// =====================================================================
// NEXORA — Phase 1 (prototype). Stockage local : données sur cet appareil.
// ==ENGINE START==  (moteur comptable pur, sans dépendance à l'interface)
// =====================================================================
'use strict';

const JOURNALS = [
  {code:'AC', label:'Journal des achats'},
  {code:'VT', label:'Journal des ventes'},
  {code:'BQ', label:'Journal de banque'},
  {code:'CA', label:'Journal de caisse'},
  {code:'OD', label:'Opérations diverses'},
  {code:'AN', label:'À-nouveaux (reprise des soldes)'}
];

// Extrait indicatif d'un plan SYSCOHADA révisé. À compléter et à valider avec le référentiel officiel.
const DEFAULT_ACCOUNTS = [
  ['101','Capital social','C'],['111','Réserve légale','C'],['121','Report à nouveau créditeur','C'],
  ['129','Report à nouveau débiteur','D'],['131','Résultat net : bénéfice','C'],['139','Résultat net : perte','D'],
  ['162','Emprunts auprès des établissements de crédit','C'],
  ['244','Matériel et mobilier','D'],['245','Matériel de transport','D'],['284','Amortissements du matériel','C'],
  ['311','Marchandises','D'],
  ['401','Fournisseurs','C'],['411','Clients','D'],['422','Personnel, rémunérations dues','C'],
  ['4431','TVA facturée sur ventes','C'],['4452','TVA récupérable sur achats','D'],
  ['521','Banques locales','D'],['571','Caisse','D'],
  ['601','Achats de marchandises','D'],['605','Autres achats','D'],['622','Locations et charges locatives','D'],
  ['624','Entretien, réparations et maintenance','D'],['628','Frais de télécommunications','D'],['631','Frais bancaires','D'],
  ['661','Rémunérations directes versées au personnel national','D'],
  ['701','Ventes de marchandises','C'],['706','Services vendus','C']
];

const CHARGE_GROUPS = {
  '60':'Achats et variations de stocks','61':'Transports','62':'Services extérieurs A','63':'Services extérieurs B',
  '64':'Impôts et taxes','65':'Autres charges','66':'Charges de personnel','67':'Frais financiers et charges assimilées',
  '68':'Dotations aux amortissements'
};
const PRODUIT_GROUPS = {
  '70':'Ventes','71':'Subventions d\'exploitation','72':'Production immobilisée','73':'Variations de stocks de produits',
  '75':'Autres produits','77':'Revenus financiers et produits assimilés','78':'Transferts de charges'
};

const uid = (p) => (p||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
const todayISO = () => new Date().toISOString().slice(0,10);
const isoOk = (s) => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s+'T00:00:00Z'));
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function addMonths(iso,n){
  const p=iso.split('-').map(Number);
  const t=new Date(Date.UTC(p[0],p[1]-1+n,1));
  const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();
  t.setUTCDate(Math.min(p[2],last));
  return t.toISOString().slice(0,10);
}
const fyEnd = (c) => addDays(addMonths(c.fyStart,12),-1);
const fyYear = (c) => Number(c.fyStart.slice(0,4));

function toAmount(v){
  if(typeof v==='number') return (Number.isSafeInteger(v) && v>=0) ? v : NaN;
  if(v===undefined||v===null) return 0;
  const s=String(v).replace(/[\s\u00a0\u202f]/g,'');
  if(s==='') return 0;
  return /^\d+$/.test(s) ? Number(s) : NaN;
}

function newCompany(meta){
  meta = meta||{};
  return {
    id: uid('co'), name: meta.name||'Nouvelle entreprise', tradeName: meta.tradeName||'', legalForm: meta.legalForm||'',
    address: meta.address||'', phone: meta.phone||'', email: meta.email||'', taxId: meta.taxId||'', rccm: meta.rccm||'',
    sector: meta.sector||'', currency:'XOF', framework:'SYSCOHADA révisé',
    fyStart: meta.fyStart || (new Date().getUTCFullYear()+'-01-01'),
    demo: !!meta.demo,
    accounts: DEFAULT_ACCOUNTS.map(a=>({num:a[0],label:a[1],nature:a[2],active:true,custom:false})),
    entries: [], seq: {}, audit: [], createdAt: nowISO()
  };
}

function audit(c, action, target, detail){
  c.audit.push({ts: nowISO(), user:'Utilisateur local', action, target: target||'', detail: detail||''});
}
const findAccount = (c,num) => c.accounts.find(a=>a.num===String(num).trim());

function normalizeLines(lines){
  return (lines||[]).map(l=>({
    account: String(l.account||'').trim(), label: String(l.label||'').trim(), tiers: String(l.tiers||'').trim(),
    debit: toAmount(l.debit), credit: toAmount(l.credit)
  })).filter(l=> l.account!=='' || l.label!=='' || l.tiers!=='' || l.debit!==0 || l.credit!==0);
}

function checkEntry(c, e){
  const errs=[];
  if(!isoOk(e.date)) errs.push('La date est absente ou invalide.');
  else if(e.date < c.fyStart || e.date > fyEnd(c)) errs.push('La date doit être comprise dans l\'exercice ('+c.fyStart+' au '+fyEnd(c)+').');
  if(!JOURNALS.some(j=>j.code===e.journal)) errs.push('Le journal est invalide.');
  if(!e.label || !e.label.trim()) errs.push('Le libellé de l\'écriture est obligatoire.');
  if(e.lines.length<2) errs.push('Une écriture doit comporter au moins deux lignes.');
  let d=0,k=0;
  e.lines.forEach((l,i)=>{
    const n=i+1;
    const acc=findAccount(c,l.account);
    if(!l.account) errs.push('Ligne '+n+' : le compte est obligatoire.');
    else if(!acc) errs.push('Ligne '+n+' : le compte '+l.account+' n\'existe pas dans le plan comptable.');
    else if(!acc.active) errs.push('Ligne '+n+' : le compte '+l.account+' est désactivé.');
    if(Number.isNaN(l.debit)||Number.isNaN(l.credit)||!Number.isSafeInteger(l.debit)||!Number.isSafeInteger(l.credit)){
      errs.push('Ligne '+n+' : montant invalide (nombre entier positif attendu, en XOF).');
    } else {
      if(l.debit>0 && l.credit>0) errs.push('Ligne '+n+' : une ligne ne peut pas avoir un débit et un crédit à la fois.');
      if(l.debit===0 && l.credit===0) errs.push('Ligne '+n+' : renseignez un débit ou un crédit.');
      d+=l.debit; k+=l.credit;
    }
  });
  if(!errs.length){
    if(d!==k) errs.push('Écriture déséquilibrée : débit '+d+' ≠ crédit '+k+' (écart de '+Math.abs(d-k)+' XOF).');
    if(d===0) errs.push('Le total de l\'écriture ne peut pas être nul.');
  }
  return errs;
}
const entryTotal = (e) => e.lines.reduce((s,l)=>s+l.debit,0);

function saveEntry(c, input){
  let existing=null;
  if(input.id){
    existing=c.entries.find(e=>e.id===input.id);
    if(!existing) return {ok:false,errors:['Écriture introuvable.']};
    if(existing.status!=='draft') return {ok:false,errors:['Une écriture validée ne peut pas être modifiée. Utilisez la contrepassation pour la corriger.']};
  }
  const e={
    id: existing?existing.id:uid('je'), journal: input.journal, date: input.date,
    piece:(input.piece||'').trim(), ref:(input.ref||'').trim(), payMode:(input.payMode||'').trim(),
    label:(input.label||'').trim(), lines: normalizeLines(input.lines), status:'draft', number:'',
    createdAt: existing?existing.createdAt:nowISO(), demo: !!input.demo
  };
  const errs=checkEntry(c,e);
  if(errs.length) return {ok:false,errors:errs};
  if(existing){ c.entries[c.entries.indexOf(existing)]=e; audit(c,'brouillon modifié',e.id,e.label); }
  else { c.entries.push(e); audit(c,'brouillon créé',e.id,e.label); }
  return {ok:true,entry:e};
}

function validateEntry(c, id){
  const e=c.entries.find(x=>x.id===id);
  if(!e) return {ok:false,errors:['Écriture introuvable.']};
  if(e.status!=='draft') return {ok:false,errors:['Cette écriture est déjà validée.']};
  const errs=checkEntry(c,e);
  if(e.piece){
    const tot=entryTotal(e);
    const dup=c.entries.find(x=>x.id!==e.id && x.status==='validated' && x.journal===e.journal && x.piece===e.piece && entryTotal(x)===tot);
    if(dup) errs.push('Doublon probable : la pièce '+e.piece+' du même montant est déjà comptabilisée dans ce journal ('+dup.number+').');
  }
  if(errs.length) return {ok:false,errors:errs};
  const key=e.journal+'-'+fyYear(c);
  c.seq[key]=(c.seq[key]||0)+1;
  e.number=e.journal+'-'+fyYear(c)+'-'+String(c.seq[key]).padStart(4,'0');
  e.status='validated'; e.validatedAt=nowISO();
  audit(c,'écriture validée',e.id,e.number+' — '+e.label);
  return {ok:true,entry:e};
}

function postEntry(c, input){
  const r=saveEntry(c,input);
  if(!r.ok) return r;
  const v=validateEntry(c,r.entry.id);
  if(!v.ok){ // on ne garde pas un brouillon issu d'une validation refusée
    c.entries=c.entries.filter(x=>x.id!==r.entry.id);
    return v;
  }
  return v;
}

function deleteDraft(c,id){
  const e=c.entries.find(x=>x.id===id);
  if(!e) return {ok:false,errors:['Écriture introuvable.']};
  if(e.status!=='draft') return {ok:false,errors:['Une écriture validée ne peut pas être supprimée. Utilisez la contrepassation.']};
  c.entries=c.entries.filter(x=>x.id!==id);
  audit(c,'brouillon supprimé',id,e.label);
  return {ok:true};
}

function reverseEntry(c,id,reason,date){
  const o=c.entries.find(x=>x.id===id);
  if(!o) return {ok:false,errors:['Écriture introuvable.']};
  if(o.status!=='validated') return {ok:false,errors:['Seule une écriture validée peut être contrepassée.']};
  if(o.reversedBy) return {ok:false,errors:['Cette écriture a déjà été contrepassée.']};
  if(o.reversalOf) return {ok:false,errors:['Une contrepassation ne peut pas être contrepassée.']};
  if(!reason||!reason.trim()) return {ok:false,errors:['Le motif de la correction est obligatoire.']};
  const input={
    journal:o.journal, date:date||todayISO(), piece:o.piece, ref:o.ref, payMode:o.payMode,
    label:'Contrepassation de '+o.number+' : '+reason.trim(),
    lines:o.lines.map(l=>({account:l.account,label:l.label,tiers:l.tiers,debit:l.credit,credit:l.debit})), demo:o.demo
  };
  const r=saveEntry(c,input);
  if(!r.ok) return r;
  const rev=r.entry;
  rev.reversalOf=o.id; rev.correctionReason=reason.trim(); rev.piece=''; 
  const v=validateEntry(c,rev.id);
  if(!v.ok){ c.entries=c.entries.filter(x=>x.id!==rev.id); return v; }
  o.reversedBy=rev.id;
  audit(c,'écriture contrepassée',o.id,o.number+' → '+rev.number+' ('+reason.trim()+')');
  return {ok:true,entry:rev};
}

function addAccount(c,num,label,nature){
  num=String(num||'').trim(); label=String(label||'').trim();
  if(!/^[1-7]\d{2,7}$/.test(num)) return {ok:false,errors:['Numéro invalide : 3 à 8 chiffres, classes 1 à 7 uniquement dans cette version.']};
  if(!label) return {ok:false,errors:['L\'intitulé est obligatoire.']};
  if(findAccount(c,num)) return {ok:false,errors:['Le compte '+num+' existe déjà.']};
  if(nature!=='D'&&nature!=='C') return {ok:false,errors:['Nature du compte invalide.']};
  c.accounts.push({num,label,nature,active:true,custom:true});
  c.accounts.sort((a,b)=>a.num.localeCompare(b.num,'fr',{numeric:true}));
  audit(c,'compte ajouté',num,label);
  return {ok:true};
}

// ---------- Calculs (toujours à partir des écritures VALIDÉES) ----------
const validated = (c) => c.entries.filter(e=>e.status==='validated');
const sortEntries = (a,b) => a.date.localeCompare(b.date) || (a.number||'').localeCompare(b.number||'') || a.createdAt.localeCompare(b.createdAt);

function computeBalances(c, from, to){
  const m={};
  const get=(n)=>m[n]||(m[n]={num:n,openD:0,openC:0,movD:0,movC:0});
  validated(c).forEach(e=>{
    e.lines.forEach(l=>{
      if(e.journal==='AN'){ const r=get(l.account); r.openD+=l.debit; r.openC+=l.credit; }
      else if(e.date<from){ const r=get(l.account); r.openD+=l.debit; r.openC+=l.credit; }
      else if(e.date<=to){ const r=get(l.account); r.movD+=l.debit; r.movC+=l.credit; }
    });
  });
  return m;
}
function trialBalance(c, from, to){
  const m=computeBalances(c,from,to);
  const rows=Object.values(m).map(r=>{
    const acc=findAccount(c,r.num);
    const o=r.openD-r.openC, f=o+r.movD-r.movC;
    return {num:r.num,label:acc?acc.label:'(compte inconnu)',
      openD:o>0?o:0, openC:o<0?-o:0, movD:r.movD, movC:r.movC, finD:f>0?f:0, finC:f<0?-f:0};
  }).sort((a,b)=>a.num.localeCompare(b.num,'fr',{numeric:true}));
  const t=rows.reduce((s,r)=>({openD:s.openD+r.openD,openC:s.openC+r.openC,movD:s.movD+r.movD,movC:s.movC+r.movC,finD:s.finD+r.finD,finC:s.finC+r.finC}),
    {openD:0,openC:0,movD:0,movC:0,finD:0,finC:0});
  const anomalies=[];
  if(t.movD!==t.movC) anomalies.push('Les mouvements débiteurs ('+t.movD+') diffèrent des mouvements créditeurs ('+t.movC+').');
  if(t.openD!==t.openC) anomalies.push('Les soldes initiaux débiteurs ('+t.openD+') diffèrent des soldes créditeurs ('+t.openC+').');
  if(t.finD!==t.finC) anomalies.push('Les soldes finaux débiteurs ('+t.finD+') diffèrent des soldes créditeurs ('+t.finC+').');
  rows.forEach(r=>{ if(!findAccount(c,r.num)) anomalies.push('Le compte '+r.num+' n\'existe pas dans le plan comptable.'); });
  return {rows,totals:t,anomalies};
}
function ledgerFor(c, num, from, to){
  let open=0; const lines=[];
  validated(c).slice().sort(sortEntries).forEach(e=>{
    e.lines.forEach(l=>{
      if(l.account!==num) return;
      if(e.journal==='AN' || e.date<from) open+=l.debit-l.credit;
      else if(e.date<=to) lines.push({date:e.date,number:e.number,entryId:e.id,piece:e.piece,label:l.label||e.label,tiers:l.tiers,debit:l.debit,credit:l.credit});
    });
  });
  let run=open; lines.forEach(l=>{run+=l.debit-l.credit; l.balance=run;});
  return {open,lines,close:run,totD:lines.reduce((s,l)=>s+l.debit,0),totC:lines.reduce((s,l)=>s+l.credit,0)};
}
function accountsWithActivity(c,from,to){
  const m=computeBalances(c,from,to);
  return Object.values(m).filter(r=>r.openD||r.openC||r.movD||r.movC).map(r=>r.num).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
}
// Cumul net (débit − crédit) de tous les comptes jusqu'à la date "to"
function cumulative(c,to){
  const m={};
  validated(c).forEach(e=>{
    if(e.journal!=='AN' && e.date>to) return;
    e.lines.forEach(l=>{ m[l.account]=(m[l.account]||0)+l.debit-l.credit; });
  });
  return m;
}
function incomeStatement(c,from,to){
  const m=computeBalances(c,from,to);
  const charges={},produits={};
  Object.values(m).forEach(r=>{
    const net=r.movD-r.movC; if(!net) return;
    const k=r.num.slice(0,2), cls=r.num[0];
    if(cls==='6'){ (charges[k]=charges[k]||{items:[],total:0}); charges[k].items.push({num:r.num,label:(findAccount(c,r.num)||{}).label||'',amount:net}); charges[k].total+=net; }
    if(cls==='7'){ (produits[k]=produits[k]||{items:[],total:0}); produits[k].items.push({num:r.num,label:(findAccount(c,r.num)||{}).label||'',amount:-net}); produits[k].total+=-net; }
  });
  const sum=(o)=>Object.values(o).reduce((s,g)=>s+g.total,0);
  const totalCharges=sum(charges), totalProduits=sum(produits);
  const net=(num)=>{const r=m[num];return r?r.movD-r.movC:0;};
  return {charges,produits,totalCharges,totalProduits,result:totalProduits-totalCharges,
    margeMarchandises:-net('701')-net('601')};
}
function balanceSheet(c,to){
  const cum=cumulative(c,to);
  const nums=Object.keys(cum).filter(n=>cum[n]!==0);
  const pre=(p)=>nums.filter(n=>n.startsWith(p));
  const sumNet=(list)=>list.reduce((s,n)=>s+cum[n],0);
  const resultat=-(sumNet(nums.filter(n=>n[0]==='6'||n[0]==='7')));
  const actif={items:[],total:0}, passif={items:[],total:0};
  const A=(label,amount,detail)=>{actif.items.push({label,amount,detail});actif.total+=amount;};
  const P=(label,amount,detail)=>{passif.items.push({label,amount,detail});passif.total+=amount;};
  A('Immobilisations nettes (classe 2, amortissements déduits)', sumNet(nums.filter(n=>n[0]==='2')));
  A('Stocks (classe 3)', sumNet(nums.filter(n=>n[0]==='3')));
  A('Créances et autres actifs circulants (comptes 4 à solde débiteur)', nums.filter(n=>n[0]==='4'&&cum[n]>0).reduce((s,n)=>s+cum[n],0));
  A('Trésorerie-actif (comptes 5 à solde débiteur)', nums.filter(n=>n[0]==='5'&&cum[n]>0).reduce((s,n)=>s+cum[n],0));
  const cp=nums.filter(n=>/^1[0-5]/.test(n));
  P('Capitaux propres (comptes 10 à 15)', -sumNet(cp));
  P('Résultat de la période (provisoire, classes 6 et 7)', resultat);
  P('Dettes financières (comptes 16 à 19)', -sumNet(nums.filter(n=>/^1[6-9]/.test(n))));
  P('Dettes et autres passifs circulants (comptes 4 à solde créditeur)', nums.filter(n=>n[0]==='4'&&cum[n]<0).reduce((s,n)=>s-cum[n],0));
  P('Trésorerie-passif (comptes 5 à solde créditeur)', nums.filter(n=>n[0]==='5'&&cum[n]<0).reduce((s,n)=>s-cum[n],0));
  return {actif,passif,resultat,gap:actif.total-passif.total};
}
function periodTotals(c,from,to){
  const is=incomeStatement(c,from,to);
  const rev=(is.produits['70']||{total:0}).total;
  let cin=0,cout=0;
  validated(c).forEach(e=>{
    if(e.journal==='AN'||e.date<from||e.date>to) return;
    const net=e.lines.filter(l=>l.account[0]==='5').reduce((s,l)=>s+l.debit-l.credit,0);
    if(net>0) cin+=net; else if(net<0) cout+=-net;
  });
  return {revenue:rev,expenses:is.totalCharges,produits:is.totalProduits,result:is.result,cashIn:cin,cashOut:cout};
}
function monthlySeries(c){
  const out=[];
  for(let i=0;i<12;i++){
    const from=addMonths(c.fyStart,i), to=addDays(addMonths(c.fyStart,i+1),-1);
    out.push({from,to,produits:0,charges:0,cash:0});
  }
  validated(c).forEach(e=>{
    if(e.journal==='AN') return;
    const s=out.find(x=>e.date>=x.from&&e.date<=x.to); if(!s) return;
    e.lines.forEach(l=>{
      const k=l.account[0];
      if(k==='7') s.produits+=l.credit-l.debit;
      else if(k==='6') s.charges+=l.debit-l.credit;
      else if(k==='5') s.cash+=l.debit-l.credit;
    });
  });
  return out;
}
function globalCheck(c){
  let d=0,k=0; validated(c).forEach(e=>e.lines.forEach(l=>{d+=l.debit;k+=l.credit;}));
  return {debit:d,credit:k,ok:d===k};
}

function periodRange(c){
  const p=UI.period, fs=c.fyStart, fe=fyEnd(c);
  if(p.type==='d'){const d=(p.day>=fs&&p.day<=fe)?p.day:fs;return {from:d,to:d,label:fmtD(d)};}
  if(p.type==='m'){const f=addMonths(fs,p.n);const y=f.slice(0,4);return {from:f,to:addDays(addMonths(f,1),-1),label:MONTHS_L[Number(f.slice(5,7))-1]+' '+y};}
  if(p.type==='q'){const f=addMonths(fs,3*p.n);return {from:f,to:addDays(addMonths(f,3),-1),label:'T'+(p.n+1)+' '+fs.slice(0,4)};}
  return {from:fs,to:fe,label:'Exercice '+fs.slice(0,4)};
}
function prevRange(c){
  const p=UI.period, saved=JSON.stringify(p);
  let r=null;
  if(p.type==='d'&&periodRange(c).from>c.fyStart){const d=addDays(periodRange(c).from,-1);r={from:d,to:d,label:fmtD(d)};}
  else if((p.type==='m'||p.type==='q')&&p.n>0){UI.period=Object.assign({},p,{n:p.n-1});r=periodRange(c);UI.period=JSON.parse(saved);}
  return r;
}

// ---------- Vue d'ensemble ----------
function barsSVG(labels,a,b,ca,cb){
  const W=640,H=230,pl=46,pb=26,pt=10,pr=8,n=labels.length;
  const max=Math.max(1,...a,...b), gw=(W-pl-pr)/n, bw=Math.min(14,gw/2.5), ph=H-pt-pb;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Produits et charges par mois">';
  for(let i=0;i<=4;i++){const y=pt+ph-ph*i/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#E6EAF0"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(max*i/4)+'</text>';}
  labels.forEach((l,i)=>{
    const x=pl+gw*i+gw/2, ha=ph*a[i]/max, hb=ph*b[i]/max;
    s+='<rect x="'+(x-bw-1)+'" y="'+(pt+ph-ha)+'" width="'+bw+'" height="'+ha+'" fill="'+ca+'"/><rect x="'+(x+1)+'" y="'+(pt+ph-hb)+'" width="'+bw+'" height="'+hb+'" fill="'+cb+'"/><text x="'+x+'" y="'+(H-8)+'" text-anchor="middle">'+l+'</text>';
  });
  return s+'</svg>';
}
function cashSVG(labels,v){
  const W=640,H=180,pl=46,pb=24,pt=10,pr=8,n=labels.length;
  const mx=Math.max(1,...v.map(x=>Math.max(x,0))),mn=Math.min(0,...v), rng=mx-mn, ph=H-pt-pb, gw=(W-pl-pr)/n, bw=Math.min(18,gw/1.8);
  const y0=pt+ph*(mx/rng);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Variation mensuelle de la trésorerie"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y0+'" y2="'+y0+'" stroke="#C6CFDB"/><text x="'+(pl-6)+'" y="'+(pt+4)+'" text-anchor="end">'+short(mx)+'</text><text x="'+(pl-6)+'" y="'+(y0+4)+'" text-anchor="end">0</text>'+(mn<0?'<text x="'+(pl-6)+'" y="'+(H-pb+4)+'" text-anchor="end">'+short(mn)+'</text>':'');
  v.forEach((x,i)=>{const cx=pl+gw*i+gw/2,h=ph*Math.abs(x)/rng;s+='<rect x="'+(cx-bw/2)+'" y="'+(x>=0?y0-h:y0)+'" width="'+bw+'" height="'+h+'" fill="'+(x>=0?'#1E8A5A':'#C23B3B')+'"/><text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+labels[i]+'</text>';});
  return s+'</svg>';
}
function delta(cur,prev,goodUp){
  if(prev===null||prev===undefined) return '';
  if(prev===0) return cur===0?'':'<span class="h">nouveau</span>';
  const p=(cur-prev)/Math.abs(prev)*100; const up=p>=0;
  return '<span class="'+((up===goodUp)?'d-up':'d-down')+'">'+(up?'▲ ':'▼ ')+Math.abs(p).toFixed(1).replace('.',',')+' %</span> <span class="h">vs période précédente</span>';
}
function viewOverview(c){
  const r=periodRange(c), pt=periodTotals(c,r.from,r.to), pr=prevRange(c), pp=pr?periodTotals(c,pr.from,pr.to):null;
  const cum=cumulative(c,r.to);
  const sumP=(p)=>Object.keys(cum).filter(n=>n.startsWith(p)).reduce((s,n)=>s+cum[n],0);

// ---------- Écritures ----------
function filteredEntries(c){
  const r=periodRange(c), f=UI.filters, q=f.q.trim().toLowerCase();
  return c.entries.filter(e=>{
    if(e.status==='validated' && e.journal!=='AN' && (e.date<r.from||e.date>r.to)) return false;
    if(e.status==='draft' && (e.date<r.from||e.date>r.to)) return false;
    if(f.journal&&e.journal!==f.journal) return false;
    if(f.status&&e.status!==f.status) return false;
    if(f.account&&!e.lines.some(l=>l.account.startsWith(f.account))) return false;
    if(q&&!((e.label+' '+e.piece+' '+e.ref+' '+e.number).toLowerCase().includes(q))) return false;
    return true;
  }).sort(sortEntries);
}
function statusChip(e){
  if(e.status==='draft') return '<span class="chip d">Brouillon</span>';
  if(e.reversedBy) return '<span class="chip r">Contrepassée</span>';
  if(e.reversalOf) return '<span class="chip">Contrepassation</span>';
  return '<span class="chip v">Validée</span>';
}

// ---------- Exports ----------
function csv(rows){return '\ufeff'+rows.map(r=>r.map(x=>{const s=String(x==null?'':x);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\r\n');}
function download(name,text,mime){const b=new Blob([text],{type:mime||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const slug=(s)=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
function doExport(kind){
  const c=co(); if(kind==='exportBackup'){download('nexora-sauvegarde-'+todayISO()+'.json',JSON.stringify(S,null,2),'application/json');return;}
  if(!c) return; const r=periodRange(c), base='nexora-'+slug(c.name)+'-';
  if(kind==='exportJournal'){
    const rows=[['Date','N°','Journal','Statut','Pièce','Référence','Libellé écriture','Compte','Intitulé','Libellé ligne','Tiers','Débit','Crédit']];
    filteredEntries(c).forEach(e=>e.lines.forEach(l=>{const a=findAccount(c,l.account);rows.push([e.date,e.number,e.journal,e.status==='draft'?'brouillon':'validée',e.piece,e.ref,e.label,l.account,a?a.label:'',l.label,l.tiers,l.debit,l.credit]);}));
    download(base+'journal-'+r.from+'.csv',csv(rows));
  } else if(kind==='exportLedger'){

    const L=ledgerFor(c,UI.ledgerAcc,r.from,r.to), rows=[['Compte',UI.ledgerAcc],['Solde initial',L.open],[],['Date','N°','Pièce','Libellé','Débit','Crédit','Solde progressif']];
    L.lines.forEach(l=>rows.push([l.date,l.number,l.piece,l.label,l.debit,l.credit,l.balance])); rows.push(['Solde final','','','',L.totD,L.totC,L.close]);
    download(base+'grand-livre-'+UI.ledgerAcc+'.csv',csv(rows));
  } else if(kind==='exportTrial'){
    const b=trialBalance(c,r.from,r.to), rows=[['Compte','Intitulé','Initial débit','Initial crédit','Mouvements débit','Mouvements crédit','Final débit','Final crédit']];
    b.rows.forEach(x=>rows.push([x.num,x.label,x.openD,x.openC,x.movD,x.movC,x.finD,x.finC])); const t=b.totals; rows.push(['Totaux','',t.openD,t.openC,t.movD,t.movC,t.finD,t.finC]);
    download(base+'balance-'+r.from+'.csv',csv(rows));
  } else if(kind==='exportStatement'){
    const is=incomeStatement(c,r.from,r.to), bs=balanceSheet(c,r.to), rows=[['COMPTE DE RÉSULTAT SIMPLIFIÉ',r.label],['Rubrique','Montant']];
    Object.keys(is.produits).sort().forEach(k=>rows.push(['Produits '+k+' '+(PRODUIT_GROUPS[k]||''),is.produits[k].total])); rows.push(['Total produits',is.totalProduits]);
    Object.keys(is.charges).sort().forEach(k=>rows.push(['Charges '+k+' '+(CHARGE_GROUPS[k]||''),is.charges[k].total])); rows.push(['Total charges',is.totalCharges],['Résultat net provisoire',is.result],[],['BILAN SIMPLIFIÉ',r.to],['Actif','Montant']);
    bs.actif.items.forEach(i=>rows.push([i.label,i.amount])); rows.push(['Total actif',bs.actif.total],['Passif','Montant']); bs.passif.items.forEach(i=>rows.push([i.label,i.amount])); rows.push(['Total passif',bs.passif.total]);
    download(base+'etats-'+r.to+'.csv',csv(rows));
  }
}

// ---------- Modules métier : ventes, achats, tiers, stocks, trésorerie, dépenses ----------
const EXP_CATS=[['622','Loyer'],['624','Entretien et réparations'],['628','Téléphone et internet'],['631','Frais bancaires'],['661','Salaires'],['605','Autres achats']];
const KP={sale:'FAC',quote:'DEV',purchase:'ACH',expense:'DEP'};
const $v=(id)=>document.getElementById(id).value;
const optH=(a,s)=>a.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===s?' selected':'')+'>'+esc(x[1])+'</option>').join('');
function ens(c){c.tiers=c.tiers||[];c.docs=c.docs||[];c.items=c.items||[];
  if(!findAccount(c,'603')){c.accounts.push({num:'603',label:'Variations des stocks de biens achetés',nature:'D',active:true,custom:true});c.accounts.sort((a,b)=>a.num.localeCompare(b.num,'fr',{numeric:true}));}}
const tier=(c,id)=>c.tiers.find(t=>t.id===id);
const artOf=(c,id)=>c.items.find(a=>a.id===id);
const docPaid=(d)=>(d.pays||[]).reduce((s,p)=>s+p.amount,0);
function docState(d){
  if(d.cancelled) return ['Annulée','r'];
  if(d.kind==='quote') return d.conv?['Facturé','v']:['Devis','d'];
  const r=d.ttc-docPaid(d);
  if(r<=0) return ['Payée','v'];
  if(d.due&&d.due<todayISO()) return ['En retard','r'];
  return [docPaid(d)?'Partielle':'Impayée','d'];
}
function nextNum(c,k){const key='doc-'+k;c.seq[key]=(c.seq[key]||0)+1;return k+'-'+fyYear(c)+'-'+String(c.seq[key]).padStart(4,'0');}
function postDoc(c,d){
  const t=tier(c,d.tid), nm=t?t.name:'', L=[], sum={};
  const add=(a,dr,cr,lb)=>L.push({account:a,label:lb||d.num,tiers:'',debit:dr,credit:cr});
  const acc=(a,v)=>{sum[a]=(sum[a]||0)+v;};
  let jr,lab;
  if(d.kind==='sale'){
    for(const i of d.items){const a=i.art&&artOf(c,i.art); if(i.art&&!a) return {ok:false,errors:['Article introuvable.']}; if(a){const need=d.items.filter(x=>x.art===i.art).reduce((s,x)=>s+x.qty,0); if(need>a.qty) return {ok:false,errors:['Stock insuffisant pour « '+a.name+' » : '+a.qty+' disponible(s).']}; i.cost=a.cost;}}
    jr='VT';lab='Facture '+d.num+(nm?' — '+nm:'');
    L.push({account:'411',label:d.num,tiers:nm,debit:d.ttc,credit:0});
    d.items.forEach(i=>acc(i.art?'701':'706',i.ht)); Object.keys(sum).forEach(a=>add(a,0,sum[a]));
    add('4431',0,d.tva);
    d.items.filter(i=>i.art).forEach(i=>{const k=i.cost*i.qty;add('603',k,0,'Coût '+i.label);add('311',0,k,'Sortie de stock '+i.label);});
  } else if(d.kind==='purchase'){
    jr='AC';lab='Achat '+d.num+(nm?' — '+nm:'');
    d.items.forEach(i=>acc(i.art?'311':'601',i.ht)); Object.keys(sum).forEach(a=>add(a,sum[a],0));
    add('4452',d.tva,0);
    L.push({account:'401',label:d.num,tiers:nm,debit:0,credit:d.ttc});
  } else {
    jr=d.acc==='571'?'CA':'BQ'; lab='Dépense '+d.num+' — '+((EXP_CATS.find(x=>x[0]===d.cat)||[])[1]||'');
    d.items.forEach(i=>acc(d.cat,i.ht)); Object.keys(sum).forEach(a=>add(a,sum[a],0));
    add('4452',d.tva,0); add(d.acc,0,d.ttc);
  }
  const r=postEntry(c,{journal:jr,date:d.date,piece:d.num,label:lab,lines:L.filter(l=>l.debit||l.credit)});
  if(!r.ok) return r;
  d.entryId=r.entry.id;
  d.items.filter(i=>i.art).forEach(i=>{const a=artOf(c,i.art);
    if(d.kind==='sale') a.qty-=i.qty;
    else if(d.kind==='purchase'){const q=a.qty+i.qty; a.cost=q>0?Math.round((a.qty*a.cost+i.qty*i.pu)/q):a.cost; a.qty=q;}});
  if(d.kind==='expense') d.pays=[{date:d.date,amount:d.ttc,acc:d.acc}];
  return {ok:true};
}
function payDoc(c,d,amount,date,acc){
  const rest=d.ttc-docPaid(d);
  if(!Number.isSafeInteger(amount)||amount<=0||amount>rest) return {ok:false,errors:['Montant invalide (reste à payer : '+fmt(rest)+' XOF).']};
  const t=tier(c,d.tid), nm=t?t.name:'', sale=d.kind==='sale';
  const L=sale?[{account:acc,label:'Règlement '+d.num,tiers:'',debit:amount,credit:0},{account:'411',label:d.num,tiers:nm,debit:0,credit:amount}]
              :[{account:'401',label:d.num,tiers:nm,debit:amount,credit:0},{account:acc,label:'Règlement '+d.num,tiers:'',debit:0,credit:amount}];

    if(okR(postEntry(c,{journal:'OD',date:$v('v_d'),piece:'',label:'Virement interne '+(f==='571'?'caisse':'banque')+' → '+(t==='571'?'caisse':'banque'),lines:[{account:t,label:'Virement interne',debit:a,credit:0},{account:f,label:'Virement interne',debit:0,credit:a}]}),'Virement enregistré.'))render();},
  recon(){const c=co(),b=(cumulative(c,periodRange(c).to)['521']||0),v=Number($v('rc_a')),e=v-b;document.getElementById('rc').innerHTML='Solde comptable : <b>'+fmt(b)+'</b> · Relevé : <b>'+fmt(v)+'</b> · Écart : <b class="'+(e?'neg':'')+'">'+fmt(e)+'</b>'+(e?'. Vérifiez les opérations non encore passées en banque ou non saisies.':' : rapprochement concordant.');},
  exportDocs(){const c=co();ens(c);const rows=[['N°','Type','Date','Échéance','Tiers','HT','TVA','TTC','Réglé','État']];c.docs.forEach(d=>{const t=tier(c,d.tid);rows.push([d.num,d.kind,d.date,d.due,t?t.name:'',d.ht,d.tva,d.ttc,docPaid(d),docState(d)[0]]);});download('nexora-'+slug(c.name)+'-documents.csv',csv(rows));},
  exportStock(){const c=co();ens(c);const rows=[['Article','Quantité','Coût moyen','Valeur','Prix vente']];c.items.forEach(a=>rows.push([a.name,a.qty,a.cost,a.qty*a.cost,a.pv]));download('nexora-'+slug(c.name)+'-stock.csv',csv(rows));}
});
document.addEventListener('change',(ev)=>{const t=ev.target;if(t.classList&&t.classList.contains('artsel')){const a=artOf(co(),t.value),tr=t.closest('tr');if(a){if(!tr.querySelector('.lab').value)tr.querySelector('.lab').value=a.name;tr.querySelector('.p').value=UI.dk==='purchase'?a.cost:a.pv;}}});

document.addEventListener('click',(ev)=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const fn=ACTIONS[el.dataset.act]; if(fn) fn(el,ev);
});
document.addEventListener('input',(ev)=>{
  const t=ev.target;
  if(t.dataset.f&&UI.form){UI.form[t.dataset.f]=t.value;return;}
  if(t.dataset.l!==undefined&&UI.form){
    const i=Number(t.dataset.l),k=t.dataset.k; UI.form.lines[i][k]=t.value;
    if(k==='debit'||k==='credit') updateTotals();
    if(k==='account'){const m=t.value.match(/^\s*(\d+)/);const h=document.getElementById('h'+i);if(h)h.innerHTML=accHint(co(),m?m[1]:t.value);}
    return;
  }
  if(t.dataset.inp==='planq'){UI.plan.q=t.value;const p=t.selectionStart;render();const n=document.querySelector('[data-inp=planq]');if(n){n.focus();n.setSelectionRange(p,p);}}
  if(t.dataset.inp==='fa'||t.dataset.inp==='fq'){UI.filters[t.dataset.inp==='fa'?'account':'q']=t.value;const p=t.selectionStart,id=t.id;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(p,p);}}
});
document.addEventListener('change',(ev)=>{
  const t=ev.target;
  if(t.id==='impFile'){
    const f=t.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{try{const p=JSON.parse(rd.result);if(!p||typeof p.companies!=='object'||!Array.isArray(p.order))throw new Error('format');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;S=p;if(!S.companies[S.activeId])S.activeId=S.order[0]||null;save();toast('Sauvegarde importée.');render();}catch(e){toast('Fichier de sauvegarde invalide.',true);}};
    rd.readAsText(f); return;
  }
  if(t.dataset.l!==undefined&&t.dataset.k==='account'&&UI.form){const m=t.value.match(/^\s*(\d+)/);if(m){t.value=m[1];UI.form.lines[Number(t.dataset.l)].account=m[1];const h=document.getElementById('h'+t.dataset.l);if(h)h.innerHTML=accHint(co(),m[1]);}return;}
  const k=t.dataset.chg; if(!k) return; const c=co();
  if(k==='company'){S.activeId=t.value;UI.period={type:'y',n:0,day:todayISO()};UI.ledgerAcc='';UI.form=null;save();render();}
  else if(k==='ptype'){UI.period.type=t.value;UI.period.n=0;render();}
  else if(k==='pn'){UI.period.n=Number(t.value);render();}
  else if(k==='pday'){UI.period.day=t.value;render();}
  else if(k==='fj'){UI.filters.journal=t.value;render();}
  else if(k==='fs'){UI.filters.status=t.value;render();}
  else if(k==='lgacc'){UI.ledgerAcc=t.value;render();}
  else if(k==='plancls'){UI.plan.cls=t.value;render();}
});
document.addEventListener('keydown',(ev)=>{if(ev.key==='Escape')closeModal();});
document.getElementById('modal').addEventListener('click',(ev)=>{if(ev.target.id==='modal')closeModal();});
window.addEventListener('hashchange',route);
window.addEventListener('beforeinstallprompt',(ev)=>{ev.preventDefault();window.__installEvt=ev;renderSide();});
window.addEventListener('appinstalled',()=>{window.__installEvt=null;renderSide();toast('NEXORA est installée sur cet appareil.');});
if(typeof module==='undefined'){ loadState(); route(); }
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
